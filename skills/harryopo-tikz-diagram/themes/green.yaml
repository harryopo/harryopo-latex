name: green
display_name: 清新绿色主题
description: 清新绿色系，适合教学文档、环保主题、农业/生物领域
colors:
  paper_border: "#9AE6B4"      # 柔和绿边框
  paper_fill: "#FFFFFF"        # 纯白模块填充
  paper_title: "#22543D"       # 深绿标题
  paper_layer_bg: "#F0FFF4"    # 层背景：极淡绿
  paper_layer_border: "#C6F6D5" # 层边框：更浅的绿
  paper_muted: "#276749"       # 次要文字：深绿
  accent_orange: "#DD6B20"     # 强调色：柔和橙
  layer_title_color: "#22543D" # 层标题色
  shadow_color: "#E0E8F0"      # 阴影色：极淡蓝灰
mix_examples:
  - "paper_border!70!white"
  - "paper_muted!50!white"
  - "paper_title!80!black"
  - "accent_orange!90!black"
